# Replace pai.example.com with the domain assigned to this PaiVoice service.
# Terminate TLS at Nginx; keep the Python WebSocket process bound to 127.0.0.1.
server {
    listen 443 ssl http2;
    server_name pai.example.com;

    # Configure certificate paths with your TLS certificate manager.
    ssl_certificate     /etc/letsencrypt/live/pai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pai.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
